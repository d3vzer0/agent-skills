[project]
name = "agent-skills"
version = "0.0.1"
description = "Custom agent skills"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.14",
]


[tool.ruff.lint]
extend-select = ["I"]


[tool.ruff.lint.isort]
case-sensitive = true